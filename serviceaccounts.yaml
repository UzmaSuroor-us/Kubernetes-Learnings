#A ServiceAccount is a Kubernetes identity used by applications and processes running inside a cluster to interact with the Kubernetes API.
#For example, a monitoring application running inside a Pod may need permission to list Pods or read Deployments. A ServiceAccount provides the identity that RBAC permissions can be granted to.
#Common use cases:
#Applications accessing the Kubernetes API
#Monitoring agents reading cluster resources
#CI/CD workloads deploying applications
#Controllers managing Kubernetes resources
#Restricting application permissions using RBAC
#
#
#
apiVersion: v1                       # Kubernetes API version
kind: ServiceAccount                 # Resource type

metadata:
  name: <serviceaccount-name>        # ServiceAccount name
  namespace: <namespace>             # Namespace

automountServiceAccountToken: false  # Disable automatic token mounting
#By default, a Pod uses the namespace's default ServiceAccount unless another is specified. Modern Kubernetes commonly uses short-lived, projected ServiceAccount tokens rather than automatically creating long-lived token Secrets.
#
#
#
#Use a ServiceAccount in a Pod or Deployment
spec:
  serviceAccountName: <serviceaccount-name>  # Identity for the Pod
  containers:
    - name: <container-name>
      image: <image-name>
#
#
#
#Give the ServiceAccount permissions using RBAC
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: pod-reader
  namespace: <namespace>

rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
#
#
#
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: pod-reader-binding
  namespace: <namespace>

subjects:
  - kind: ServiceAccount
    name: <serviceaccount-name>
    namespace: <namespace>

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
#
#
#
#Commands
#kubectl create serviceaccount <name> -n <namespace>
#kubectl apply -f serviceaccount.yaml
#kubectl get serviceaccounts
#kubectl get sa
#kubectl get sa -A
#kubectl describe sa <name> -n <namespace>
#kubectl get sa <name> -n <namespace> -o yaml
#kubectl get sa -n <namespace>
#kubectl apply -f role.yaml
#kubectl apply -f rolebinding.yaml
#kubectl auth can-i list pods \
  --as=system:serviceaccount:<namespace>:<name> \
  -n <namespace>
#kubectl delete sa <name> -n <namespace>
