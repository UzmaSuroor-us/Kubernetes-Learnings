#A Secret is a Kubernetes resource used to store sensitive information, such as passwords, tokens, API keys, and TLS certificates.
#Examples:Database username and password, API keys, Authentication tokens, TLS certificates and private keys Registry credentials
#Instead of writing passwords directly into your Deployment YAML, you store them in a Secret and reference the Secret from your Pod.
#
#
#

apiVersion: v1                    # Kubernetes API version
kind: Secret                      # Resource type

metadata:
  name: <secret-name>              # Secret name
  namespace: <namespace>           # Namespace

type: Opaque                      # Generic key-value Secret

data:                             # Values must be Base64-encoded
  <key1>: <base64-value>

  <key2>: <base64-value>
#
#
#
stringData is convenient for learning, but Base64 is encoding, not encryption. Do not commit real credentials to Git.
apiVersion: v1
kind: Secret

metadata:
  name: <secret-name>

type: Opaque

stringData:
  <username-key>: <username>
  <password-key>: <password>
#
#
#
#How to use a Secret in a Deployment
#As environment variables
env:
  - name: <env-variable-name>
    valueFrom:
      secretKeyRef:
        name: <secret-name>       # Secret to read
        key: <secret-key>         # Key inside Secret
#
#
#
#Import all Secret keys as environment variables
envFrom:
  - secretRef:
      name: <secret-name>         # Import all keys
#
#
#
#Mount a Secret as files
volumes:
  - name: secret-volume
    secret:
      secretName: <secret-name>   # Secret to mount
#
#
#
#kubectl apply -f secret.yaml
#kubectl get secrets
#kubectl get secrets -A
#kubectl describe secret <secret-name>
#kubectl get secret <secret-name> -o yaml
#kubectl edit secret <secret-name>
#kubectl get secret <secret-name> \
  -o jsonpath='{.data.<key>}' | base64 --decode
#kubectl delete secret <secret-name>


